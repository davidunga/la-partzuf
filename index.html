<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <title>La' Partzuf</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
        <style>
            :root {
                --bg-primary: #0d0d0d;
                --bg-secondary: #1a1a1a;
                --bg-elevated: #242424;

                --surface: #1f1f1f;
                --surface-hover: #252525;

                --primary: #ffffff;
                --secondary: #a1a1a1;
                --tertiary: #6b6b6b;

                --reference-1: #ff6b6b;
                --reference-2: #4ecdc4;
                --subject: #ffd93d;

                --border: rgba(255, 255, 255, 0.08);
                --border-hover: rgba(255, 255, 255, 0.15);

                --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.4);
                --shadow-md: 0 4px 24px rgba(0, 0, 0, 0.5);
                --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.6);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }

            body {
                font-family:
                    "Inter",
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                background: var(--bg-primary);
                color: var(--primary);
                min-height: 100vh;
                padding: 1.5rem;
                line-height: 1.6;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            @media (min-width: 768px) {
                body {
                    padding: 3rem 2rem;
                }
            }

            .container {
                max-width: 1200px;
                margin: 0 auto;
            }

            header {
                text-align: center;
                margin-bottom: 2.5rem;
                animation: fadeInDown 0.6s ease-out;
            }

            @media (min-width: 768px) {
                header {
                    margin-bottom: 4rem;
                }
            }

            h1 {
                font-family: "Cormorant Garamond", serif;
                font-size: 2.5rem;
                font-weight: 300;
                color: var(--primary);
                margin-bottom: 0.5rem;
                letter-spacing: 0.02em;
            }

            @media (min-width: 768px) {
                h1 {
                    font-size: 3.5rem;
                }
            }

            .subtitle {
                font-size: 0.95rem;
                color: var(--secondary);
                font-weight: 300;
                letter-spacing: 0.03em;
            }

            @media (min-width: 768px) {
                .subtitle {
                    font-size: 1.05rem;
                }
            }

            .status-banner {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 1rem;
                margin-bottom: 2rem;
                text-align: center;
                font-size: 0.9rem;
                color: var(--secondary);
                animation: fadeInUp 0.6s ease-out 0.1s both;
            }

            @media (min-width: 768px) {
                .status-banner {
                    padding: 1.25rem;
                    margin-bottom: 3rem;
                }
            }

            .status-banner.loading {
                border-color: rgba(255, 217, 61, 0.3);
                color: var(--subject);
            }

            .status-banner.error {
                border-color: rgba(255, 107, 107, 0.3);
                color: var(--reference-1);
                background: rgba(255, 107, 107, 0.05);
            }

            .role-section {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                margin-bottom: 2rem;
                animation: fadeInUp 0.6s ease-out 0.2s both;
            }

            @media (min-width: 768px) {
                .role-section {
                    gap: 1.25rem;
                    margin-bottom: 3rem;
                }
            }

            .role-btn {
                display: flex;
                align-items: center;
                gap: 1rem;
                width: 100%;
                padding: 1.1rem 1.25rem;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 16px;
                color: var(--primary);
                font-family: "Inter", sans-serif;
                font-size: 1rem;
                cursor: pointer;
                transition: all 0.3s ease;
                text-align: left;
            }

            .role-btn:active {
                transform: scale(0.99);
            }

            @media (min-width: 768px) {
                .role-btn:hover {
                    border-color: var(--border-hover);
                    transform: translateY(-2px);
                    box-shadow: var(--shadow-md);
                }
            }

            .role-pill {
                font-size: 0.75rem;
                font-weight: 500;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                padding: 0.4rem 0.85rem;
                border-radius: 20px;
                white-space: nowrap;
            }

            .role-pill.role-parent-1 {
                background: rgba(255, 107, 107, 0.1);
                color: var(--reference-1);
            }

            .role-pill.role-parent-2 {
                background: rgba(78, 205, 196, 0.1);
                color: var(--reference-2);
            }

            .role-pill.role-child {
                background: rgba(255, 217, 61, 0.1);
                color: var(--subject);
            }

            .role-name {
                flex: 1;
                color: var(--secondary);
                font-weight: 400;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .role-btn.is-set .role-name {
                color: var(--primary);
                font-weight: 500;
            }

            .role-icon {
                font-family: "Cormorant Garamond", serif;
                font-size: 1.6rem;
                color: var(--secondary);
                width: 28px;
                text-align: center;
                line-height: 1;
            }

            .role-btn.is-set .role-icon {
                font-size: 1rem;
            }

            .modal-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.7);
                display: none;
                align-items: flex-start;
                justify-content: center;
                padding: 1.5rem;
                overflow-y: auto;
                z-index: 100;
            }

            .modal-overlay.show {
                display: flex;
                animation: fadeIn 0.2s ease-out;
            }

            @media (min-width: 768px) {
                .modal-overlay {
                    align-items: center;
                    padding: 3rem 2rem;
                }
            }

            .modal-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 16px;
                width: 100%;
                max-width: 520px;
                box-shadow: var(--shadow-lg);
                animation: fadeInUp 0.3s ease-out;
                overflow: hidden;
            }

            .modal-header {
                padding: 1.1rem 1.5rem;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: rgba(255, 255, 255, 0.02);
            }

            .modal-title {
                font-family: "Cormorant Garamond", serif;
                font-size: 1.5rem;
                font-weight: 400;
                color: var(--primary);
            }

            .modal-close {
                background: transparent;
                border: none;
                color: var(--secondary);
                font-size: 1.6rem;
                cursor: pointer;
                line-height: 1;
                padding: 0.25rem 0.6rem;
                border-radius: 8px;
                transition: all 0.2s ease;
            }

            .modal-close:hover {
                color: var(--primary);
                background: rgba(255, 255, 255, 0.05);
            }

            .modal-footer {
                padding: 1rem 1.5rem;
                border-top: 1px solid var(--border);
                display: flex;
                justify-content: flex-end;
                background: rgba(255, 255, 255, 0.02);
            }

            .modal-done {
                background: var(--primary);
                color: var(--bg-primary);
                border: none;
                padding: 0.75rem 2rem;
                border-radius: 10px;
                font-family: "Inter", sans-serif;
                font-weight: 500;
                font-size: 0.95rem;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .modal-done:hover {
                background: var(--secondary);
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            .person-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 16px;
                overflow: hidden;
                transition: all 0.3s ease;
            }

            .person-card:active {
                transform: scale(0.98);
            }

            @media (min-width: 768px) {
                .person-card:hover {
                    border-color: var(--border-hover);
                    transform: translateY(-4px);
                    box-shadow: var(--shadow-md);
                }

                .person-card:active {
                    transform: scale(1);
                }
            }

            .card-label {
                padding: 1.25rem 1.5rem;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: rgba(255, 255, 255, 0.02);
            }

            .label-content {
                display: flex;
                align-items: center;
                gap: 0.75rem;
            }

            .person-number {
                font-family: "Cormorant Garamond", serif;
                font-size: 1.5rem;
                font-weight: 400;
                color: var(--primary);
                width: 38px;
                height: 38px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
                background: var(--bg-elevated);
                border: 1px solid var(--border);
            }

            .label-text {
                font-size: 0.8rem;
                font-weight: 500;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                padding: 0.4rem 0.9rem;
                border-radius: 20px;
                background: rgba(255, 255, 255, 0.05);
                color: var(--secondary);
            }

            .person-card.person-1 .label-text {
                background: rgba(255, 107, 107, 0.1);
                color: var(--reference-1);
            }

            .person-card.person-2 .label-text {
                background: rgba(78, 205, 196, 0.1);
                color: var(--reference-2);
            }

            .person-card.person-3 .label-text {
                background: rgba(255, 217, 61, 0.1);
                color: var(--subject);
            }

            .card-body {
                padding: 1.5rem;
            }

            .name-input {
                width: 100%;
                background: var(--bg-elevated);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 0.875rem 1rem;
                color: var(--primary);
                font-size: 1rem;
                font-weight: 400;
                outline: none;
                transition: all 0.3s ease;
                margin-bottom: 1.25rem;
                font-family: "Inter", sans-serif;
            }

            .name-input:focus {
                background: var(--surface-hover);
                border-color: var(--border-hover);
                box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
            }

            .name-input::placeholder {
                color: rgb(255, 0, 80);
            }

            .add-photos-btn {
                display: block;
                width: 100%;
                padding: 0.875rem 1rem;
                background: var(--bg-elevated);
                border: 1px solid var(--border);
                border-radius: 10px;
                color: var(--primary);
                font-family: "Inter", sans-serif;
                font-size: 0.95rem;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s ease;
                margin-bottom: 1.25rem;
            }

            .add-photos-btn:hover {
                background: var(--surface-hover);
                border-color: var(--border-hover);
            }

            .add-photos-btn:active {
                transform: scale(0.99);
            }

            .preview-img-wrap {
                position: relative;
                display: inline-block;
            }

            .preview-remove {
                position: absolute;
                top: 4px;
                right: 4px;
                width: 22px;
                height: 22px;
                border-radius: 50%;
                background: rgba(0, 0, 0, 0.7);
                color: #fff;
                border: 1px solid rgba(255, 255, 255, 0.2);
                font-size: 0.9rem;
                line-height: 1;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
                transition: all 0.2s ease;
            }

            .preview-remove:hover {
                background: rgba(255, 80, 80, 0.9);
            }

            .upload-zone {
                border: 2px dashed var(--border);
                border-radius: 12px;
                padding: 2.5rem 1.5rem;
                text-align: center;
                cursor: pointer;
                transition: all 0.3s ease;
                background: rgba(255, 255, 255, 0.02);
                min-height: 160px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            .upload-zone:active {
                transform: scale(0.98);
            }

            @media (min-width: 768px) {
                .upload-zone:hover {
                    border-color: var(--border-hover);
                    background: rgba(255, 255, 255, 0.04);
                }
            }

            .upload-zone.dragover {
                border-color: var(--primary);
                background: rgba(255, 255, 255, 0.06);
                border-style: solid;
            }

            .upload-icon {
                width: 48px;
                height: 48px;
                margin-bottom: 1rem;
                opacity: 0.4;
            }

            .upload-text {
                color: var(--secondary);
                font-size: 0.95rem;
                line-height: 1.5;
                font-weight: 400;
            }

            .upload-text small {
                display: block;
                font-size: 0.8rem;
                color: var(--tertiary);
                margin-top: 0.4rem;
                font-weight: 300;
            }

            .image-preview {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
                gap: 0.75rem;
                margin-top: 1.25rem;
            }

            @media (min-width: 768px) {
                .image-preview {
                    grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
                }
            }

            .preview-img {
                width: 100%;
                height: 75px;
                object-fit: cover;
                border-radius: 8px;
                border: 1px solid var(--border);
                animation: scaleIn 0.3s ease-out;
                transition: all 0.2s ease;
            }

            @media (min-width: 768px) {
                .preview-img {
                    height: 85px;
                }

                .preview-img:hover {
                    transform: scale(1.05);
                    border-color: var(--border-hover);
                }
            }

            .analyze-btn {
                display: block;
                width: 100%;
                margin: 0 auto 2rem;
                background: var(--primary);
                color: var(--bg-primary);
                border: none;
                padding: 1rem;
                font-size: 1rem;
                font-weight: 500;
                border-radius: 12px;
                cursor: pointer;
                font-family: "Inter", sans-serif;
                letter-spacing: 0.02em;
                transition: all 0.3s ease;
                animation: fadeInUp 0.6s ease-out 0.4s both;
                touch-action: manipulation;
            }

            @media (min-width: 768px) {
                .analyze-btn {
                    width: auto;
                    padding: 1rem 3rem;
                    margin-bottom: 3rem;
                }
            }

            .analyze-btn:active:not(:disabled) {
                transform: scale(0.96);
            }

            @media (min-width: 768px) {
                .analyze-btn:hover:not(:disabled) {
                    background: var(--secondary);
                    transform: translateY(-2px);
                    box-shadow: var(--shadow-md);
                }
            }

            .analyze-btn:disabled {
                opacity: 0.3;
                cursor: not-allowed;
            }

            .spectrum-container {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 2rem 1.5rem;
                animation: fadeInUp 0.6s ease-out 0.6s both;
                min-height: 400px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            @media (min-width: 768px) {
                .spectrum-container {
                    padding: 3rem;
                    min-height: 450px;
                }
            }

            .spectrum-title {
                font-family: "Cormorant Garamond", serif;
                font-size: 1.75rem;
                font-weight: 400;
                text-align: center;
                margin-bottom: 2.5rem;
                color: var(--primary);
            }

            @media (min-width: 768px) {
                .spectrum-title {
                    font-size: 2rem;
                    margin-bottom: 3rem;
                }
            }

            .spectrum-scale {
                position: relative;
                height: 220px;
                margin: 0 1rem;
            }

            @media (min-width: 768px) {
                .spectrum-scale {
                    margin: 0 4rem;
                }
            }

            .scale-line {
                position: absolute;
                top: 50%;
                left: 0;
                right: 0;
                height: 1px;
                background: linear-gradient(
                    90deg,
                    var(--reference-2),
                    transparent 30%,
                    transparent 70%,
                    var(--reference-1)
                );
                opacity: 0.3;
            }

            .scale-endpoint {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.75rem;
            }

            .scale-endpoint.left {
                left: -0.5rem;
            }

            .scale-endpoint.right {
                right: -0.5rem;
            }

            @media (min-width: 768px) {
                .scale-endpoint.left {
                    left: -3rem;
                }

                .scale-endpoint.right {
                    right: -3rem;
                }
            }

            .endpoint-avatar {
                width: 70px;
                height: 70px;
                border-radius: 50%;
                border: 2px solid var(--reference-2);
                object-fit: cover;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            }

            @media (min-width: 768px) {
                .endpoint-avatar {
                    width: 90px;
                    height: 90px;
                    border-width: 3px;
                }

                .endpoint-avatar:hover {
                    transform: scale(1.05);
                }
            }

            .scale-endpoint.right .endpoint-avatar {
                border-color: var(--reference-1);
            }

            .endpoint-name {
                font-weight: 500;
                font-size: 0.85rem;
                color: var(--primary);
                text-align: center;
            }

            @media (min-width: 768px) {
                .endpoint-name {
                    font-size: 0.9rem;
                }
            }

            .endpoint-label {
                font-size: 0.7rem;
                color: var(--tertiary);
                text-transform: uppercase;
                letter-spacing: 0.05em;
                font-weight: 500;
            }

            .person-marker {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.75rem;
                transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
                opacity: 0;
            }

            .person-marker.show {
                opacity: 1;
            }

            .marker-avatar {
                width: 90px;
                height: 90px;
                border-radius: 50%;
                border: 3px solid var(--subject);
                object-fit: cover;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
                animation: float 3s ease-in-out infinite;
            }

            @media (min-width: 768px) {
                .marker-avatar {
                    width: 110px;
                    height: 110px;
                    border-width: 4px;
                }
            }

            .marker-name {
                font-weight: 600;
                font-size: 0.95rem;
                color: var(--primary);
                text-align: center;
            }

            @media (min-width: 768px) {
                .marker-name {
                    font-size: 1rem;
                }
            }

            .marker-label {
                font-size: 0.7rem;
                color: var(--tertiary);
                text-transform: uppercase;
                letter-spacing: 0.05em;
                font-weight: 500;
            }

            .result-axis {
                position: relative;
                height: 280px;
                padding: 0 1rem;
            }

            @media (min-width: 768px) {
                .result-axis {
                    height: 320px;
                    padding: 0 2rem;
                }
            }

            .axis-track {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 45px;
                right: 45px;
            }

            @media (min-width: 768px) {
                .axis-track {
                    left: 60px;
                    right: 60px;
                }
            }

            .axis-line {
                position: absolute;
                left: 0;
                right: 0;
                top: 70%;
                height: 1px;
                background: rgba(255, 255, 255, 0.25);
            }

            .axis-endpoint {
                position: absolute;
                top: 70%;
                transform: translate(-50%, -50%);
            }

            .axis-endpoint.left {
                left: 0;
            }

            .axis-endpoint.right {
                left: 100%;
            }

            .endpoint-bubble {
                width: 70px;
                height: 70px;
                border-radius: 50%;
                border: 3px solid var(--reference-2);
                object-fit: cover;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
                display: block;
            }

            .axis-endpoint.right .endpoint-bubble {
                border-color: var(--reference-1);
            }

            @media (min-width: 768px) {
                .endpoint-bubble {
                    width: 90px;
                    height: 90px;
                }
            }

            .child-marker {
                position: absolute;
                bottom: 30%;
                transform: translateX(-50%);
                display: flex;
                flex-direction: column;
                align-items: center;
                animation: fadeInUp 0.6s ease-out;
                transition: left 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            }

            .child-labels {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.25rem;
                margin-bottom: 0.6rem;
                white-space: nowrap;
            }

            .child-label {
                font-size: 0.78rem;
                font-weight: 500;
                padding: 0.25rem 0.65rem;
                border-radius: 12px;
                letter-spacing: 0.02em;
            }

            .child-label.parent-1 {
                background: rgba(255, 107, 107, 0.12);
                color: var(--reference-1);
            }

            .child-label.parent-2 {
                background: rgba(78, 205, 196, 0.12);
                color: var(--reference-2);
            }

            .child-bubble {
                width: 70px;
                height: 70px;
                border-radius: 50%;
                border: 3px solid var(--subject);
                object-fit: cover;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
                display: block;
                margin-bottom: 30px;
            }

            @media (min-width: 768px) {
                .child-bubble {
                    width: 90px;
                    height: 90px;
                    margin-bottom: 40px;
                }
            }

            .child-stem {
                position: absolute;
                bottom: 5px;
                width: 1px;
                height: 30px;
                background: rgba(255, 255, 255, 0.2);
            }

            @media (min-width: 768px) {
                .child-stem {
                    height: 40px;
                }
            }

            .child-dot {
                position: absolute;
                bottom: -5px;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--subject);
                box-shadow: 0 0 0 4px rgba(255, 217, 61, 0.2);
            }

            .similarity-info {
                text-align: center;
                margin-top: 2rem;
                padding: 1.5rem;
                background: rgba(255, 255, 255, 0.03);
                border-radius: 12px;
                font-size: 0.9rem;
                color: var(--secondary);
                line-height: 1.9;
                border: 1px solid var(--border);
            }

            @media (min-width: 768px) {
                .similarity-info {
                    margin-top: 2.5rem;
                    padding: 1.75rem;
                    font-size: 0.95rem;
                }
            }

            .similarity-value {
                color: var(--primary);
                font-weight: 600;
            }

            .loading {
                text-align: center;
                padding: 2rem;
                color: var(--secondary);
                font-style: italic;
                font-weight: 300;
            }

            @media (min-width: 768px) {
                .loading {
                    padding: 3rem;
                }
            }

            .loading::after {
                content: "...";
                animation: dots 1.5s steps(4, end) infinite;
            }

            .error-message {
                background: rgba(255, 107, 107, 0.08);
                border: 1px solid rgba(255, 107, 107, 0.2);
                border-radius: 12px;
                padding: 1.5rem;
                margin: 2rem 0;
                color: var(--reference-1);
                text-align: center;
                font-weight: 400;
            }

            @keyframes dots {
                0%,
                20% {
                    content: ".";
                }
                40% {
                    content: "..";
                }
                60%,
                100% {
                    content: "...";
                }
            }

            @keyframes fadeInDown {
                from {
                    opacity: 0;
                    transform: translateY(-20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes scaleIn {
                from {
                    opacity: 0;
                    transform: scale(0.9);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            @keyframes float {
                0%,
                100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-8px);
                }
            }

            /* iOS specific improvements */
            @supports (-webkit-touch-callout: none) {
                body {
                    min-height: -webkit-fill-available;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>La' Partzuf</h1>
                <p class="subtitle">Face Similarity Analysis</p>
            </header>

            <div class="status-banner" id="statusBanner" style="display: none;">
                Loading AI models...
            </div>
            
            <div class="role-section">
                <button type="button" class="role-btn" data-role-for="1">
                    <span class="role-pill role-parent-1">Parent</span>
                    <span class="role-name" data-role-name>Add</span>
                    <span class="role-icon" data-role-icon>+</span>
                </button>
                <button type="button" class="role-btn" data-role-for="2">
                    <span class="role-pill role-parent-2">Parent</span>
                    <span class="role-name" data-role-name>Add</span>
                    <span class="role-icon" data-role-icon>+</span>
                </button>
                <button type="button" class="role-btn" data-role-for="3">
                    <span class="role-pill role-child">Child</span>
                    <span class="role-name" data-role-name>Add</span>
                    <span class="role-icon" data-role-icon>+</span>
                </button>
            </div>

            <div class="modal-overlay" id="personModal" aria-hidden="true">
                <div class="modal-card">
                    <div class="modal-header">
                        <div class="modal-title" id="modalTitle">Parent</div>
                        <button
                            type="button"
                            class="modal-close"
                            id="modalClose"
                            aria-label="Close"
                        >
                            ×
                        </button>
                    </div>
                    <div class="card-body">
                        <input
                            type="text"
                            class="name-input"
                            id="modalName"
                            placeholder="Enter name"
                        />
                        <button
                            type="button"
                            class="add-photos-btn"
                            id="modalUploadZone"
                        >
                            + Add Photos
                        </button>
                        <input
                            type="file"
                            multiple
                            accept="image/*"
                            style="display: none"
                            id="modalFileInput"
                        />
                        <div class="image-preview" id="modalPreview"></div>
                    </div>
                    <div class="modal-footer">
                        <button
                            type="button"
                            class="modal-done"
                            id="modalDone"
                        >
                            Done
                        </button>
                    </div>
                </div>
            </div>

            <button class="analyze-btn" id="analyzeBtn" disabled>
                Analyze
            </button>

            <div class="spectrum-container" id="spectrumContainer">
                <div class="spectrum-title">Similarity Spectrum</div>
                <div id="spectrumContent">
                    <p
                        style="
                            text-align: center;
                            color: var(--secondary);
                            font-style: italic;
                            font-weight: 300;
                        "
                    >
                        Upload images for all three people to begin analysis
                    </p>
                </div>
            </div>
        </div>

        <script>
            // Store uploaded images for each person
            const personData = {
                1: { images: [], name: "", embeddings: [] },
                2: { images: [], name: "", embeddings: [] },
                3: { images: [], name: "", embeddings: [] },
            };

            const STORAGE_KEY = "la-partzuf-people-v1";

            function savePersonData() {
                try {
                    const serial = {};
                    for (const id of ["1", "2", "3"]) {
                        serial[id] = {
                            name: personData[id].name,
                            images: personData[id].images.map((it) => ({
                                data: it.data,
                            })),
                        };
                    }
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(serial));
                } catch (e) {
                    console.warn("Failed to persist person data:", e);
                }
            }

            function loadPersonData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return;
                    const parsed = JSON.parse(raw);
                    for (const id of ["1", "2", "3"]) {
                        if (!parsed[id]) continue;
                        personData[id].name = parsed[id].name || "";
                        personData[id].images = (parsed[id].images || []).map(
                            (it) => ({ data: it.data, file: null }),
                        );
                    }
                } catch (e) {
                    console.warn("Failed to restore person data:", e);
                }
            }

            let modelsLoaded = false;
            let modelsReadyPromise = null;
            let detSession = null;
            let recSession = null;
            let ageAxis = null;

            const MAX_PHOTO_DIM = 800;

            function downscaleImage(dataUrl) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.min(
                            1,
                            MAX_PHOTO_DIM / Math.max(img.width, img.height),
                        );
                        if (scale >= 1) {
                            resolve(dataUrl);
                            return;
                        }
                        const w = Math.round(img.width * scale);
                        const h = Math.round(img.height * scale);
                        const canvas = document.createElement("canvas");
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL("image/jpeg", 0.9));
                    };
                    img.onerror = () => resolve(dataUrl);
                    img.src = dataUrl;
                });
            }

            const DET_INPUT_SIZE = 640;
            const DET_SCORE_THRESH = 0.5;
            const DET_NMS_THRESH = 0.4;
            const FEAT_STRIDES = [8, 16, 32];
            const NUM_ANCHORS = 2;

            // ArcFace canonical 5-keypoint template for 112x112 alignment
            // Order: left eye, right eye, nose, left mouth, right mouth
            const ARCFACE_TEMPLATE = [
                [38.2946, 51.6963],
                [73.5318, 51.5014],
                [56.0252, 71.7366],
                [41.5493, 92.3655],
                [70.7299, 92.2041],
            ];

            function loadModels() {
                const statusBanner = document.getElementById("statusBanner");
                statusBanner.classList.add("loading");
                statusBanner.textContent = "Loading AI models...";

                ort.env.wasm.wasmPaths =
                    "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";

                modelsReadyPromise = Promise.all([
                    ort.InferenceSession.create("models/detection.onnx", {
                        executionProviders: ["wasm"],
                    }),
                    ort.InferenceSession.create("models/recognition.onnx", {
                        executionProviders: ["wasm"],
                    }),
                    fetch("models/age_axis.json")
                        .then((r) => (r.ok ? r.json() : null))
                        .then((d) =>
                            d && Array.isArray(d.direction)
                                ? new Float32Array(d.direction)
                                : null,
                        )
                        .catch(() => null),
                ])
                    .then(([det, rec, axis]) => {
                        detSession = det;
                        recSession = rec;
                        ageAxis = axis;
                        modelsLoaded = true;
                        statusBanner.classList.remove("loading");
                        statusBanner.textContent = "Ready to analyze faces";
                        setTimeout(() => {
                            statusBanner.style.display = "none";
                        }, 3000);
                    })
                    .catch((error) => {
                        console.error("Error loading models:", error);
                        statusBanner.classList.add("error");
                        statusBanner.textContent =
                            "Error loading AI models. Please refresh the page.";
                        throw error;
                    });
                return modelsReadyPromise;
            }

            // Load models on page load
            window.addEventListener("load", loadModels);

            // Restore persisted person data and refresh role buttons
            loadPersonData();
            for (const id of ["1", "2", "3"]) updateRoleButton(id);
            updateAnalyzeButton();

            const ROLE_LABELS = { 1: "Parent", 2: "Parent", 3: "Child" };

            const personModal = document.getElementById("personModal");
            const modalNameInput = document.getElementById("modalName");
            const modalUploadZone = document.getElementById("modalUploadZone");
            const modalFileInput = document.getElementById("modalFileInput");
            const modalPreview = document.getElementById("modalPreview");

            function openPersonModal(personId) {
                personModal.dataset.editing = personId;
                document.getElementById("modalTitle").textContent =
                    ROLE_LABELS[personId];
                modalNameInput.value = personData[personId].name || "";
                renderModalPreview(personId);
                personModal.classList.add("show");
                personModal.setAttribute("aria-hidden", "false");
            }

            function closePersonModal() {
                const personId = personModal.dataset.editing;
                if (personId) {
                    updateRoleButton(personId);
                    updateAnalyzeButton();
                }
                personModal.classList.remove("show");
                personModal.setAttribute("aria-hidden", "true");
                delete personModal.dataset.editing;
            }

            function renderModalPreview(personId) {
                modalPreview.innerHTML = "";
                personData[personId].images.forEach((item, idx) => {
                    modalPreview.appendChild(makePreviewItem(item.data, idx));
                });
            }

            function makePreviewItem(dataUrl, idx) {
                const wrap = document.createElement("div");
                wrap.className = "preview-img-wrap";
                wrap.dataset.idx = idx;
                const img = document.createElement("img");
                img.src = dataUrl;
                img.className = "preview-img";
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "preview-remove";
                btn.setAttribute("aria-label", "Remove photo");
                btn.textContent = "×";
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const personId = personModal.dataset.editing;
                    if (!personId) return;
                    const i = Number(wrap.dataset.idx);
                    personData[personId].images.splice(i, 1);
                    renderModalPreview(personId);
                    savePersonData();
                });
                wrap.appendChild(img);
                wrap.appendChild(btn);
                return wrap;
            }

            function updateRoleButton(personId) {
                const btn = document.querySelector(
                    `.role-btn[data-role-for="${personId}"]`,
                );
                const nameEl = btn.querySelector("[data-role-name]");
                const iconEl = btn.querySelector("[data-role-icon]");
                const data = personData[personId];
                const isSet = data.name && data.images.length > 0;
                btn.classList.toggle("is-set", isSet);
                if (isSet) {
                    const count = data.images.length;
                    nameEl.textContent = `${data.name} • ${count} photo${count === 1 ? "" : "s"}`;
                    iconEl.textContent = "✎";
                } else {
                    nameEl.textContent = "Add";
                    iconEl.textContent = "+";
                }
            }

            document.querySelectorAll(".role-btn").forEach((btn) => {
                btn.addEventListener("click", () =>
                    openPersonModal(btn.dataset.roleFor),
                );
            });

            document
                .getElementById("modalClose")
                .addEventListener("click", closePersonModal);
            document
                .getElementById("modalDone")
                .addEventListener("click", closePersonModal);
            personModal.addEventListener("click", (e) => {
                if (e.target === personModal) closePersonModal();
            });
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && personModal.classList.contains("show"))
                    closePersonModal();
            });

            modalNameInput.addEventListener("input", (e) => {
                const personId = personModal.dataset.editing;
                if (personId) {
                    personData[personId].name = e.target.value;
                    savePersonData();
                }
            });

            modalUploadZone.addEventListener("click", () =>
                modalFileInput.click(),
            );
            modalFileInput.addEventListener("change", (e) => {
                const personId = personModal.dataset.editing;
                if (personId) handleFiles(personId, e.target.files);
                modalFileInput.value = "";
            });

            function handleFiles(personId, files) {
                Array.from(files).forEach((file) => {
                    if (!file.type.startsWith("image/")) return;
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const data = await downscaleImage(e.target.result);
                        personData[personId].images.push({
                            data,
                            file,
                        });
                        if (personModal.dataset.editing === personId) {
                            renderModalPreview(personId);
                        }
                        savePersonData();
                    };
                    reader.readAsDataURL(file);
                });
            }

            function updateAnalyzeButton() {
                const allHaveImages =
                    personData[1].images.length > 0 &&
                    personData[2].images.length > 0 &&
                    personData[3].images.length > 0;
                const allHaveNames =
                    personData[1].name &&
                    personData[2].name &&
                    personData[3].name;

                document.getElementById("analyzeBtn").disabled = !(
                    allHaveImages && allHaveNames
                );
            }

            function loadImage(imageDataUrl) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () =>
                        reject(new Error("Failed to load image"));
                    img.src = imageDataUrl;
                });
            }

            // Letterbox an image into a square canvas of `size` and return
            // pixel data plus the scale + offsets used so coordinates can be
            // mapped back to the original image.
            function letterboxToCanvas(img, size) {
                const scale = Math.min(size / img.width, size / img.height);
                const w = Math.round(img.width * scale);
                const h = Math.round(img.height * scale);
                const dx = Math.floor((size - w) / 2);
                const dy = Math.floor((size - h) / 2);
                const canvas = document.createElement("canvas");
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext("2d");
                ctx.fillStyle = "rgb(0,0,0)";
                ctx.fillRect(0, 0, size, size);
                ctx.drawImage(img, dx, dy, w, h);
                const imageData = ctx.getImageData(0, 0, size, size);
                return { imageData, scale, dx, dy };
            }

            // Convert RGBA ImageData → CHW Float32Array with mean/std applied.
            function imageDataToCHW(imageData, mean, std) {
                const { data, width, height } = imageData;
                const out = new Float32Array(3 * width * height);
                const plane = width * height;
                for (let i = 0, p = 0; i < data.length; i += 4, p++) {
                    out[p] = (data[i] - mean) / std;
                    out[p + plane] = (data[i + 1] - mean) / std;
                    out[p + 2 * plane] = (data[i + 2] - mean) / std;
                }
                return out;
            }

            function generateAnchors(size, stride, numAnchors) {
                const h = Math.floor(size / stride);
                const w = Math.floor(size / stride);
                const centers = new Float32Array(h * w * numAnchors * 2);
                let i = 0;
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        for (let a = 0; a < numAnchors; a++) {
                            centers[i++] = x * stride;
                            centers[i++] = y * stride;
                        }
                    }
                }
                return centers;
            }

            function nms(boxes, scores, threshold) {
                const idxs = scores
                    .map((s, i) => [s, i])
                    .sort((a, b) => b[0] - a[0])
                    .map((p) => p[1]);
                const keep = [];
                const suppressed = new Uint8Array(idxs.length);
                for (let i = 0; i < idxs.length; i++) {
                    const ii = idxs[i];
                    if (suppressed[ii]) continue;
                    keep.push(ii);
                    const [ax1, ay1, ax2, ay2] = boxes[ii];
                    const aArea = (ax2 - ax1) * (ay2 - ay1);
                    for (let j = i + 1; j < idxs.length; j++) {
                        const jj = idxs[j];
                        if (suppressed[jj]) continue;
                        const [bx1, by1, bx2, by2] = boxes[jj];
                        const ix1 = Math.max(ax1, bx1);
                        const iy1 = Math.max(ay1, by1);
                        const ix2 = Math.min(ax2, bx2);
                        const iy2 = Math.min(ay2, by2);
                        const iw = Math.max(0, ix2 - ix1);
                        const ih = Math.max(0, iy2 - iy1);
                        const inter = iw * ih;
                        const bArea = (bx2 - bx1) * (by2 - by1);
                        const iou = inter / (aArea + bArea - inter);
                        if (iou > threshold) suppressed[jj] = 1;
                    }
                }
                return keep;
            }

            async function detectBestFace(img) {
                const { imageData, scale, dx, dy } = letterboxToCanvas(
                    img,
                    DET_INPUT_SIZE,
                );
                const tensorData = imageDataToCHW(imageData, 127.5, 128.0);
                const inputName = detSession.inputNames[0];
                const feeds = {};
                feeds[inputName] = new ort.Tensor(
                    "float32",
                    tensorData,
                    [1, 3, DET_INPUT_SIZE, DET_INPUT_SIZE],
                );
                const out = await detSession.run(feeds);
                const outNames = detSession.outputNames;

                const allBoxes = [];
                const allScores = [];
                const allKps = [];

                for (let s = 0; s < FEAT_STRIDES.length; s++) {
                    const stride = FEAT_STRIDES[s];
                    const scores = out[outNames[s]].data;
                    const bboxPreds = out[outNames[s + 3]].data;
                    const kpsPreds = out[outNames[s + 6]].data;
                    const anchors = generateAnchors(
                        DET_INPUT_SIZE,
                        stride,
                        NUM_ANCHORS,
                    );
                    const n = scores.length;
                    for (let i = 0; i < n; i++) {
                        if (scores[i] < DET_SCORE_THRESH) continue;
                        const cx = anchors[i * 2];
                        const cy = anchors[i * 2 + 1];
                        const x1 = cx - bboxPreds[i * 4] * stride;
                        const y1 = cy - bboxPreds[i * 4 + 1] * stride;
                        const x2 = cx + bboxPreds[i * 4 + 2] * stride;
                        const y2 = cy + bboxPreds[i * 4 + 3] * stride;
                        allBoxes.push([x1, y1, x2, y2]);
                        allScores.push(scores[i]);
                        const kp = new Array(5);
                        for (let k = 0; k < 5; k++) {
                            kp[k] = [
                                cx + kpsPreds[i * 10 + k * 2] * stride,
                                cy + kpsPreds[i * 10 + k * 2 + 1] * stride,
                            ];
                        }
                        allKps.push(kp);
                    }
                }

                if (!allScores.length) return null;
                const keep = nms(allBoxes, allScores, DET_NMS_THRESH);
                // Pick largest face among kept (more reliable than top score)
                let bestIdx = keep[0];
                let bestArea = 0;
                for (const k of keep) {
                    const [x1, y1, x2, y2] = allBoxes[k];
                    const a = (x2 - x1) * (y2 - y1);
                    if (a > bestArea) {
                        bestArea = a;
                        bestIdx = k;
                    }
                }
                // Map keypoints back to original image coordinates
                const kpsOrig = allKps[bestIdx].map(([x, y]) => [
                    (x - dx) / scale,
                    (y - dy) / scale,
                ]);
                return { keypoints: kpsOrig };
            }

            // Compute 2D similarity transform (scale + rotation + translation)
            // mapping src points → dst points via least squares.
            // Returns 6 numbers (a, b, c, d, e, f) for the matrix
            // [[a, c, e], [b, d, f]] applied as p' = M * [p; 1].
            function similarityTransform(src, dst) {
                const n = src.length;
                let msx = 0,
                    msy = 0,
                    mdx = 0,
                    mdy = 0;
                for (let i = 0; i < n; i++) {
                    msx += src[i][0];
                    msy += src[i][1];
                    mdx += dst[i][0];
                    mdy += dst[i][1];
                }
                msx /= n;
                msy /= n;
                mdx /= n;
                mdy /= n;
                let s2 = 0,
                    c1 = 0,
                    c2 = 0;
                for (let i = 0; i < n; i++) {
                    const sx = src[i][0] - msx;
                    const sy = src[i][1] - msy;
                    const dx = dst[i][0] - mdx;
                    const dy = dst[i][1] - mdy;
                    s2 += sx * sx + sy * sy;
                    c1 += sx * dx + sy * dy;
                    c2 += -sy * dx + sx * dy;
                }
                const a = c1 / s2;
                const b = c2 / s2;
                const tx = mdx - a * msx + b * msy;
                const ty = mdy - a * msy - b * msx;
                // matrix [[a, -b, tx], [b, a, ty]]
                return { a, b, c: -b, d: a, e: tx, f: ty };
            }

            function alignFace(img, keypoints) {
                const m = similarityTransform(keypoints, ARCFACE_TEMPLATE);
                const canvas = document.createElement("canvas");
                canvas.width = 112;
                canvas.height = 112;
                const ctx = canvas.getContext("2d");
                ctx.fillStyle = "rgb(0,0,0)";
                ctx.fillRect(0, 0, 112, 112);
                ctx.setTransform(m.a, m.b, m.c, m.d, m.e, m.f);
                ctx.drawImage(img, 0, 0);
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                return ctx.getImageData(0, 0, 112, 112);
            }

            async function embedAlignedFace(alignedImageData) {
                const tensorData = imageDataToCHW(
                    alignedImageData,
                    127.5,
                    127.5,
                );
                const inputName = recSession.inputNames[0];
                const feeds = {};
                feeds[inputName] = new ort.Tensor(
                    "float32",
                    tensorData,
                    [1, 3, 112, 112],
                );
                const out = await recSession.run(feeds);
                const emb = out[recSession.outputNames[0]].data;
                const dim = emb.length;
                let norm = 0;
                for (let i = 0; i < dim; i++) norm += emb[i] * emb[i];
                norm = Math.sqrt(norm) || 1;
                const normed = new Float32Array(dim);
                for (let i = 0; i < dim; i++) normed[i] = emb[i] / norm;

                if (ageAxis && ageAxis.length === dim) {
                    let dot = 0;
                    for (let i = 0; i < dim; i++)
                        dot += normed[i] * ageAxis[i];
                    for (let i = 0; i < dim; i++)
                        normed[i] -= dot * ageAxis[i];
                    let n2 = 0;
                    for (let i = 0; i < dim; i++) n2 += normed[i] * normed[i];
                    n2 = Math.sqrt(n2) || 1;
                    for (let i = 0; i < dim; i++) normed[i] /= n2;
                }
                return normed;
            }

            async function getFaceEmbedding(imageDataUrl) {
                const img = await loadImage(imageDataUrl);
                const det = await detectBestFace(img);
                if (!det) throw new Error("No face detected in image");
                const aligned = alignFace(img, det.keypoints);
                return await embedAlignedFace(aligned);
            }

            function euclideanDistance(embedding1, embedding2) {
                let sum = 0;
                for (let i = 0; i < embedding1.length; i++) {
                    sum += Math.pow(embedding1[i] - embedding2[i], 2);
                }
                return Math.sqrt(sum);
            }

            function cosineDistance(embedding1, embedding2) {
                let dotProduct = 0;
                let norm1 = 0;
                let norm2 = 0;
                
                for (let i = 0; i < embedding1.length; i++) {
                    dotProduct += embedding1[i] * embedding2[i];
                    norm1 += embedding1[i] * embedding1[i];
                    norm2 += embedding2[i] * embedding2[i];
                }
                
                const cosSim = dotProduct / (Math.sqrt(norm1) * Math.sqrt(norm2));
                return 1 - cosSim;
            }
            
            function averageEmbeddings(embeddings) {
                const dim = embeddings[0].length;
                const avg = new Array(dim).fill(0);

                for (const emb of embeddings) {
                    for (let i = 0; i < dim; i++) {
                        avg[i] += emb[i];
                    }
                }

                for (let i = 0; i < dim; i++) {
                    avg[i] /= embeddings.length;
                }

                return avg;
            }

            function calculatePosition(d1_2, d1_3, d2_3) {
                const total = d1_3 + d2_3;
                if (total === 0) return 0.5;
                return Math.max(0, Math.min(1, d2_3 / total));
            }

            document
                .getElementById("analyzeBtn")
                .addEventListener("click", analyzeSimilarity);

            async function analyzeSimilarity() {
                const spectrumContent =
                    document.getElementById("spectrumContent");
                spectrumContent.innerHTML =
                    '<p class="loading">Analyzing facial features</p>';

                try {
                    if (!modelsLoaded) {
                        spectrumContent.innerHTML =
                            '<p class="loading">Loading AI models</p>';
                        await modelsReadyPromise;
                        spectrumContent.innerHTML =
                            '<p class="loading">Analyzing facial features</p>';
                    }
                    // Get embeddings for all persons
                    for (const personId of ["1", "2", "3"]) {
                        personData[personId].embeddings = [];

                        for (const img of personData[personId].images) {
                            try {
                                const embedding = await getFaceEmbedding(
                                    img.data,
                                );
                                personData[personId].embeddings.push(
                                    Array.from(embedding),
                                );
                            } catch (error) {
                                console.warn(
                                    `Skipping image for person ${personId}:`,
                                    error.message,
                                );
                            }
                        }

                        if (personData[personId].embeddings.length === 0) {
                            throw new Error(
                                `No faces detected for ${personData[personId].name}. Please use clearer face photos.`,
                            );
                        }
                    }

                    // Average embeddings
                    const embedding1 = averageEmbeddings(
                        personData["1"].embeddings,
                    );
                    const embedding2 = averageEmbeddings(
                        personData["2"].embeddings,
                    );
                    const embedding3 = averageEmbeddings(
                        personData["3"].embeddings,
                    );

                    // Calculate distances
                    const distance_1_2 = cosineDistance(
                        embedding1,
                        embedding2,
                    );
                    const distance_1_3 = cosineDistance(
                        embedding1,
                        embedding3,
                    );
                    const distance_2_3 = cosineDistance(
                        embedding2,
                        embedding3,
                    );

                    // Calculate position
                    const position = calculatePosition(
                        distance_1_2,
                        distance_1_3,
                        distance_2_3,
                    );

                    displayResults({
                        distance_1_2,
                        distance_1_3,
                        distance_2_3,
                        position,
                    });
                } catch (error) {
                    console.error("Error:", error);
                    spectrumContent.innerHTML = `
                    <div class="error-message">
                        ${error.message}
                    </div>
                `;
                }
            }

            function displayResults(result) {
                const { distance_1_3, distance_2_3, position } = result;
                const positionPercent = position * 100;

                const rawSim1 = Math.max(0, 1 - distance_1_3);
                const rawSim2 = Math.max(0, 1 - distance_2_3);
                const total = rawSim1 + rawSim2 || 1;
                const sim1 = (rawSim1 / total) * 100;
                const sim2 = (rawSim2 / total) * 100;

                const parent1Img = personData["1"].images[0].data;
                const parent2Img = personData["2"].images[0].data;
                const childImg = personData["3"].images[0].data;
                const parent1Name = personData["1"].name;
                const parent2Name = personData["2"].name;

                const html = `
                <div class="result-axis">
                    <div class="axis-track">
                        <div class="axis-line"></div>

                        <div class="axis-endpoint left">
                            <img src="${parent2Img}" class="endpoint-bubble">
                        </div>

                        <div class="axis-endpoint right">
                            <img src="${parent1Img}" class="endpoint-bubble">
                        </div>

                        <div class="child-marker" style="left: ${positionPercent}%">
                            <div class="child-labels">
                                <div class="child-label parent-1">${parent1Name}: ${sim1.toFixed(0)}%</div>
                                <div class="child-label parent-2">${parent2Name}: ${sim2.toFixed(0)}%</div>
                            </div>
                            <img src="${childImg}" class="child-bubble">
                            <div class="child-stem"></div>
                            <div class="child-dot"></div>
                        </div>
                    </div>
                </div>
            `;

                document.getElementById("spectrumContent").innerHTML = html;
            }
        </script>
    </body>
</html>
